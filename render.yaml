services:
  - type: web
    name: smart-campus-portal-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: CAMPUS_MODE
        value: demo
      - key: CAMPUS_PUBLIC_HTTPS
        value: "1"
      - key: CAMPUS_AI_PROVIDER
        value: gemini
      - key: CAMPUS_AI_MODEL
        value: gemini-2.5-flash
      - key: CAMPUS_AI_DAILY_LIMIT
        value: "100"
